# Dedicated Helix controls use the Knowledge Cards command-keyboard bridge.
# Symbols commit literal half-width text without changing the Chinese mode.
patch:
  "preset_keyboards/default/import_preset": clover_jiugong
  "preset_keyboards/use/keys/@18/click": Escape
  "preset_keyboards/use/keys/@18/label": Esc
  "preset_keyboards/luna_jiugong/keys/@14/click": Helix_enter
  "preset_keyboards/luna_jiugong/keys/@14/label": Helix
  "preset_keyboards/clover_jiugong/keys/@14/click": Helix_enter
  "preset_keyboards/clover_jiugong/keys/@14/label": Helix
  "preset_keys/Helix_enter": {label: Helix, text: "{Control+Alt+F12}{Helix_keyboard}"}
  "preset_keys/Helix_keyboard": {send: Eisu_toggle, select: helix}
  "preset_keys/Helix_chinese": {send: Eisu_toggle, select: clover_jiugong}
  "preset_keys/Helix_input": {label: 输入, text: "{Control+Alt+F11}{Helix_chinese}"}
  "preset_keys/Helix_normal": {label: Esc, send: Control+Alt+F12, functional: false}
  "preset_keys/Helix_prev_word": {label: 前词, send: Control+Alt+F1, functional: false, repeatable: true}
  "preset_keys/Helix_next_word": {label: 后词, send: Control+Alt+F2, functional: false, repeatable: true}
  "preset_keys/Helix_line_start": {label: 行首, send: Control+Alt+F3, functional: false}
  "preset_keys/Helix_line_end": {label: 行尾, send: Control+Alt+F4, functional: false}
  "preset_keys/Helix_undo": {label: 撤销, send: Control+Alt+F5, functional: false}
  "preset_keys/Helix_redo": {label: 重做, send: Control+Alt+F6, functional: false}
  "preset_keys/Helix_select": {label: 选区, send: Control+Alt+F10, functional: false}
  "preset_keyboards/helix":
    name: Helix
    ascii_mode: 1
    lock: false
    height: 58
    horizontal_gap: 6
    vertical_gap: 6
    width: 24
    keys:
      - {click: Helix_normal, width: 14}
      - {click: Helix_prev_word}
      - {click: Up, label: ↑ k}
      - {click: Helix_next_word}
      - {click: Helix_input, width: 14}
      - {click: Helix_undo, width: 14}
      - {click: Left, label: ← h}
      - {click: Helix_select}
      - {click: Right, label: → l}
      - {click: Helix_redo, width: 14}
      - {width: 14}
      - {click: Helix_line_start}
      - {click: Down, label: ↓ j}
      - {click: Helix_line_end}
      - {click: Hide, width: 14}

  # Repair the overridden old liquid-keyboard toggle; preserve clipboard long press.
  "preset_keys/Mobile_symbols": {label: 符, send: FUNCTION, command: liquid_keyboard, option: "英文"}
  "preset_keys/Mobile_clipboard": {label: 剪贴, send: FUNCTION, command: liquid_keyboard, option: "剪贴"}
  "preset_keyboards/luna_jiugong/keys/@16/click": Mobile_symbols
  "preset_keyboards/luna_jiugong/keys/@16/long_click": Mobile_clipboard
  "preset_keyboards/clover_jiugong/keys/@16/click": Mobile_symbols
  "preset_keyboards/clover_jiugong/keys/@16/long_click": Mobile_clipboard
  "preset_keys/ASCII_comma": {"label": ",", "commit": ","}
  "preset_keys/ASCII_period": {"label": ".", "commit": "."}
  "preset_keys/ASCII_colon": {"label": ":", "commit": ":"}
  "preset_keys/ASCII_semicolon": {"label": ";", "commit": ";"}
  "preset_keys/ASCII_slash": {"label": "/", "commit": "/"}
  "preset_keys/ASCII_backslash": {"label": "\\", "commit": "\\"}
  "preset_keys/ASCII_minus": {"label": "-", "commit": "-"}
  "preset_keys/ASCII_underscore": {"label": "_", "commit": "_"}
  "preset_keys/ASCII_equals": {"label": "=", "commit": "="}
  "preset_keys/ASCII_plus": {"label": "+", "commit": "+"}
  "preset_keys/ASCII_star": {"label": "*", "commit": "*"}
  "preset_keys/ASCII_hash": {"label": "#", "commit": "#"}
  "preset_keys/ASCII_backtick": {"label": "`", "commit": "`"}
  "preset_keys/ASCII_lparen": {"label": "(", "commit": "("}
  "preset_keys/ASCII_rparen": {"label": ")", "commit": ")"}
  "preset_keys/ASCII_lbracket": {"label": "[", "commit": "["}
  "preset_keys/ASCII_rbracket": {"label": "]", "commit": "]"}
  "preset_keys/ASCII_lbrace": {"label": "{", "commit": "{"}
  "preset_keys/ASCII_rbrace": {"label": "}", "commit": "}"}
  "preset_keys/ASCII_quote": {"label": "\"", "commit": "\""}
  "preset_keys/ASCII_apostrophe": {"label": "'", "commit": "'"}
  "preset_keyboards/luna_jiugong/keys/@0/long_click": ASCII_comma
  "preset_keyboards/luna_jiugong/keys/@5/long_click": ASCII_period
  "preset_keyboards/luna_jiugong/keys/@10/long_click": ASCII_lparen
  "preset_keyboards/luna_jiugong/keys/@15/long_click": ASCII_lbracket
  "preset_keyboards/clover_jiugong/keys/@0/long_click": ASCII_comma
  "preset_keyboards/clover_jiugong/keys/@5/long_click": ASCII_period
  "preset_keyboards/clover_jiugong/keys/@10/long_click": ASCII_lparen
  "preset_keyboards/clover_jiugong/keys/@15/long_click": ASCII_lbracket
  "tool_bar/buttons":
    - {"foreground": {"style": "更多", "font_size": 18, "padding": 8}, "action": "Mobile_symbols"}
    - {"foreground": {"style": "`", "font_size": 18, "padding": 8}, "action": "ASCII_backtick"}
    - {"foreground": {"style": "#", "font_size": 18, "padding": 8}, "action": "ASCII_hash"}
    - {"foreground": {"style": "/", "font_size": 18, "padding": 8}, "action": "ASCII_slash"}
    - {"foreground": {"style": ":", "font_size": 18, "padding": 8}, "action": "ASCII_colon"}
    - {"foreground": {"style": "-", "font_size": 18, "padding": 8}, "action": "ASCII_minus"}
