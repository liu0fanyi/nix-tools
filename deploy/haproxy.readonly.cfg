global
    log stdout format raw local0

defaults
    log global
    mode tcp
    timeout connect 5s
    timeout client 1h
    timeout server 1h

frontend readonly_dual_protocol
    bind :5008
    tcp-request inspect-delay 100ms
    tcp-request content accept if { req.ssl_hello_type 1 }
    use_backend readonly_https if { req.ssl_hello_type 1 }
    default_backend readonly_http

backend readonly_http
    server caddy_http caddy:5008 check

backend readonly_https
    server caddy_https caddy:5443 check
