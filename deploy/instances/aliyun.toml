schema_version = 1

[deployment]
name = "nix-tools"
profile = "aliyun-edgeone-http"
timezone = "Asia/Shanghai"

[runtime]
engine = "docker"

[domains]
public = "wttliou.top"
origin = "wttliou.top"
readonly_public = "wttliou.top"
readonly_origin = "wttliou.top"
aliases = ["www.wttliou.top"]

[features]
authelia = false
readonly = false
terminal = false
ddns = false

[paths]
host_home = "/root"
workspace = "/root/nix-tools/dufs_data"
tag_data = "/root/nix-tools/tag-db"
readonly = "/root/nix-tools/dufs_data"
media = ""
dist = "/root/nix-tools/dist"
authelia_data = "/root/nix-tools/unused/authelia"
ddns_config = "/root/nix-tools/unused/ddns-go"
caddy_data = "/root/nix-tools/caddy-data"
caddy_config = "/root/nix-tools/caddy-config"
terminal_workspace = "/root/nix-tools"
terminal_socket_dir = "/run/user/0/ttyd"
secrets = "/root/nix-tools/deploy/secrets/aliyun"

[ports]
lan = 5006
readonly_origin = 5008
main_origin = 5009
http = 80
https = 443

[images]
caddy = "docker.io/library/caddy:2.11.4-alpine"
dufs = "docker.io/sigoden/dufs:0.46.0"
tag_server = "localhost/tag-server:dufs-plus"
authelia = "docker.io/authelia/authelia:4.39.20"
ddns_go = "docker.io/jeessy/ddns-go:v6.17.2"

[security]
lan_cidrs = ["127.0.0.0/8", "::1"]
edgeone_trusted_proxies = []
container_subnet = "172.30.50.0/24"

[authelia]
issuer = "wttliou.top"
display_name = "DUFS"
session_domain = "wttliou.top"
default_policy = "one_factor"
