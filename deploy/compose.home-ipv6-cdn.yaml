services:
  caddy:
    ports:
      - "${LAN_BIND_IP:-0.0.0.0}:${LAN_PUBLISH_PORT:-5006}:5006"
      - "${ORIGIN_BIND_IP:-0.0.0.0}:${MAIN_ORIGIN_PUBLISH_PORT:-5009}:5009"

  readonly-gateway:
    image: ${READONLY_GATEWAY_IMAGE}
    restart: unless-stopped
    depends_on:
      - caddy
    volumes:
      - ./haproxy.readonly.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "${ORIGIN_BIND_IP:-0.0.0.0}:${READONLY_ORIGIN_PUBLISH_PORT:-5008}:5008"
    networks:
      - app
