<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>菜谱处理进度</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f2eb;color:#263029;font:16px/1.7 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:40px 24px}a{color:#476833}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:32px;margin:12px 0}h2{font-size:19px;margin:0}p{margin:10px 0;color:#687365}.panel,.metric{background:#fffdf8;border:1px solid #e0e4d6;border-radius:14px;padding:24px}.panel{margin:20px 0}.row{display:flex;justify-content:space-between;align-items:baseline;gap:16px}.number{font-size:28px;font-weight:650;white-space:nowrap}.percent{font-size:15px;color:#687365;margin-left:10px}progress{display:block;width:100%;height:18px;margin:15px 0 10px;border:0;border-radius:10px;overflow:hidden;background:#e8ecdf;accent-color:#658c49}progress::-moz-progress-bar{background:#658c49}progress::-webkit-progress-bar{background:#e8ecdf}progress::-webkit-progress-value{background:#658c49}.source{accent-color:#739ba1}.source::-moz-progress-bar,.source::-webkit-progress-value{background:#739ba1}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.metric{padding:16px}.metric strong{display:block;font-size:27px}.metric span{font-size:14px;color:#687365}.status{border-left:4px solid #789b59}.status strong{font-size:19px}.error{color:#9d482f}button{font:inherit;padding:8px 15px;border:1px solid #bfccaf;border-radius:8px;background:#edf3e5;color:#405c38;cursor:pointer}button:disabled{opacity:.5}.foot{font-size:14px}#updated{font-variant-numeric:tabular-nums}@media(max-width:650px){main{padding:24px 16px}.metrics{grid-template-columns:repeat(2,1fr)}.row{align-items:flex-start;flex-direction:column;gap:2px}.number{font-size:25px}h1{font-size:27px}}</style>
<main><header><a href="index.html">← 菜谱目录</a><button id="refresh">立即刷新</button></header><h1>菜谱处理进度</h1><p>只获取 AI 字幕和封面，再整理材料与制作步骤。</p><section class="panel status" aria-live="polite"><strong id="ai">正在读取 AI 整理状态…</strong><p id="ai-hint"></p></section>
<section class="panel status" aria-live="polite"><strong id="worker">正在读取进度…</strong><p id="hint">每 5 秒自动刷新。</p></section>
<section class="panel"><div class="row"><h2>已生成菜谱</h2><div><span class="number" id="recipes">—</span><span class="percent" id="recipe-percent">—</span></div></div><progress id="recipe-bar" max="1" value="0" aria-label="菜谱生成进度"></progress><p>只计算已发布菜谱，待 AI 整理和无字幕跳过不算已生成。</p></section>
<section class="panel"><div class="row"><h2>来源处理进度</h2><div><span class="number" id="sources">—</span><span class="percent" id="source-percent">—</span></div></div><progress class="source" id="source-bar" max="1" value="0" aria-label="来源处理进度"></progress><p>已生成菜谱 ＋ 待 AI 整理 ＋ 无字幕跳过。失败项仍需处理。</p></section>
<div class="metrics"><div class="metric"><strong id="published">—</strong><span>已生成菜谱</span></div><div class="metric"><strong id="waiting_extract">—</strong><span>待 AI 整理</span></div><div class="metric"><strong id="queued">—</strong><span>待采集</span></div><div class="metric"><strong id="skipped">—</strong><span>无字幕跳过</span></div><div class="metric"><strong id="failed">—</strong><span>失败待处理</span></div></div>
<p class="foot" id="remaining">—</p><p class="foot" id="updated">尚未刷新</p>
</main><script>
(()=>{'use strict';const el=id=>document.getElementById(id),fmt=n=>n.toLocaleString('zh-CN');let busy=false,timer;
function render(p){const c=p.counts,t=p.total;const ai=p.ai||{state:'not_configured',active:false};const names={not_configured:'AI 后台尚未启动',stopped:'AI 后台已停止',failed:'AI 整理失败，已停止',finished:'AI 队列已处理完毕',extracting:'AI 正在整理字幕',publishing:'正在校验并发布菜谱',published:'菜谱已发布，准备下一条',waiting_for_subtitles:'AI 正在等待下一份字幕'};el('ai').textContent=names[ai.state]||'AI 状态未知';el('ai-hint').textContent=ai.active?'后台会自动整理、校验、发布并续跑。'+(ai.current_id?'当前：'+ai.current_id+'。':'')+(ai.model?'模型：'+ai.model:''):'启动 AI 消费者后才能持续生成；失败详情留本地日志，已发布结果保留。';for(const k of ['published','waiting_extract','queued','skipped','failed'])el(k).textContent=fmt(c[k]);
 for(const [prefix,value]of [['recipe',c.published],['source',p.source_ready]]){const bar=el(prefix+'-bar');bar.max=t||1;bar.value=value;el(prefix+'-percent').textContent=(t?100*value/t:0).toFixed(2)+'%';el(prefix==='recipe'?'recipes':'sources').textContent=fmt(value)+' / '+fmt(t);}
 const state=p.collector.state;el('worker').textContent=state==='waiting_for_ai'?'采集已达上限 · 等待 AI 整理':state==='collecting'?'正在采集字幕和封面':state==='sources_finished'?'来源采集已结束':'采集器未运行';
 el('hint').textContent=state==='waiting_for_ai'?'待整理字幕已满 '+fmt(p.collector.max_pending||10)+' 份；会话整理并发布后，采集会继续。':state==='collecting'?'低频串行采集，包含请求等待；每个视频之间额外间隔 '+fmt(p.collector.interval||60)+' 秒。':state==='sources_finished'?'仍有待 AI 整理或失败项时，整批菜谱尚未完成。':'已完成结果会保留；可检查采集日志并续跑。';
 el('remaining').textContent='已结束 '+fmt(p.settled)+' 条（菜谱与无字幕跳过），剩余 '+fmt(p.remaining)+' 条。字幕采集与 AI 整理为两个后台任务；以各自实际运行状态为准。';el('updated').textContent='上次成功刷新：'+new Date().toLocaleTimeString('zh-CN')+' · 每 5 秒自动刷新';el('updated').classList.remove('error');}
async function load(){if(busy)return;busy=true;clearTimeout(timer);el('refresh').disabled=true;const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),6000);try{const r=await fetch('api/progress',{cache:'no-store',signal:controller.signal});if(!r.ok)throw Error('HTTP '+r.status);render(await r.json());}catch(e){el('updated').textContent='连接失败，显示上次读取的数据；5 秒后重试。';el('updated').classList.add('error');}finally{clearTimeout(timeout);busy=false;el('refresh').disabled=false;timer=setTimeout(load,5000);}}
el('refresh').addEventListener('click',load);load();})();
</script></html>
